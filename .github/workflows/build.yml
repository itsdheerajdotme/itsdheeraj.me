name: Build

on:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3
  workflow_call: # allow other workflows to trigger this
  workflow_dispatch:
    inputs:
      skip_cache:
        description: Skip dependency cache and do a clean install
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Next.js App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache handled manually below for skip_cache support

      - name: Restore node_modules cache
        if: github.event.inputs.skip_cache != 'true'
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build (includes Medium article fetch via prebuild)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-out
          path: out/
          retention-days: 7
